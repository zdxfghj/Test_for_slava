{% endif %}
    <form method="post" >
        {% csrf_token %}

        <div class="text-danger validation-summary-valid" data-valmsg-summary="true">
            <ul>
                <li style="display:none"></li>
            </ul>
        </div>
        <div class="row mb-3">
            <div class="col-4">
                <label>Имя пользователя</label>
            </div>
            <div class="col-8">
                <input class="form-control" type="text"

                <span class="text-danger field-validation-valid" data-valmsg-for="Input.UserName"
                      data-valmsg-replace="true"></span>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-4">
                <label>Пароль</label>
            </div>
            <div class="col-8">
                <input class="form-control" type="password"
                       data-val-required="The Пароль field is required." name="password">
                <span class="text-danger field-validation-valid" data-valmsg-for="Input.Password"
                      data-valmsg-replace="true"></span>
            </div>
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" data-val="true"
                       data-val-required="The 	Запомнить? field is required." id="Input_RememberMe"
                       name="Input.RememberMe" value="true">
                <label class="form-check-label" for="Input_RememberMe">
                    Запомнить?
                </label>
            </div>
        </div>
        <hr>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary col-3" >Войти</button>
        </div>
    </form>

</section>
